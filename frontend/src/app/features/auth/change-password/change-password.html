<main class="wrap">
  <form class="card" [formGroup]="form" (ngSubmit)="submit()" aria-labelledby="cp-title" novalidate>
    <img class="logo light" src="brand/logo.png" alt="Chubbsafes" />
    <img class="logo dark" src="brand/logo-white.png" alt="Chubbsafes" />
    <div class="badge"><mat-icon class="filled">key</mat-icon></div>
    <div>
      <h1 id="cp-title">Set your own password</h1>
      <p class="muted">
        Hi {{ firstName() }}, you signed in with a temporary password. Choose a new one to continue.
      </p>
    </div>

    @if (error()) {
      <div class="alert" role="alert"><mat-icon class="filled">error</mat-icon>{{ error() }}</div>
    }

    <label class="field">
      <span>Temporary password</span>
      <input type="password" formControlName="currentPassword" autocomplete="current-password" />
      @if (form.controls.currentPassword.touched && form.controls.currentPassword.invalid) {
        <small class="hint-error">Enter the password your administrator gave you</small>
      }
    </label>

    <label class="field">
      <span>New password</span>
      <input type="password" formControlName="newPassword" autocomplete="new-password" />
      @if (form.controls.newPassword.touched && form.controls.newPassword.invalid) {
        <small class="hint-error">Use at least {{ minLength }} characters</small>
      } @else {
        <small class="hint">At least {{ minLength }} characters.</small>
      }
    </label>

    <label class="field">
      <span>Repeat new password</span>
      <input type="password" formControlName="confirm" autocomplete="new-password" />
      @if (form.controls.confirm.touched && form.hasError('mismatch')) {
        <small class="hint-error">The two passwords are not the same</small>
      }
    </label>

    <button class="submit" type="submit" [disabled]="busy()">
      @if (busy()) {
        <mat-spinner diameter="20" />
        Saving…
      } @else {
        Save and continue
      }
    </button>
    <button class="link" type="button" (click)="logout()">Log out instead</button>
  </form>
</main>
