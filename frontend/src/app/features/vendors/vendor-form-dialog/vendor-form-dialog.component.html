<h2 mat-dialog-title>{{ isEdit ? 'Edit vendor' : 'New vendor' }}</h2>

<mat-dialog-content>
  <div class="form-fields">
    <mat-form-field appearance="outline">
      <mat-label>Vendor code</mat-label>
      <input
        matInput
        [(ngModel)]="vendaccount"
        [disabled]="isEdit"
        placeholder="e.g. V-001"
        required
        maxlength="30"
      />
      @if (!isEdit) {
        <mat-hint>Unique identifier, cannot be changed later</mat-hint>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Vendor name</mat-label>
      <input
        matInput
        [(ngModel)]="name"
        placeholder="e.g. PT Supplier"
        required
        maxlength="100"
      />
    </mat-form-field>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()" [disabled]="saving">Cancel</button>
  <button mat-flat-button color="primary" (click)="save()" [disabled]="saving">
    @if (saving) {
      Saving...
    } @else {
      {{ isEdit ? 'Update' : 'Create' }}
    }
  </button>
</mat-dialog-actions>
