<div class="new-grid">
  <app-lookup-autocomplete
    label="Part no."
    placeholder="Search part number or name"
    [required]="true"
    [minSearchLength]="2"
    [search]="itemSearch"
    (selectionChange)="onItemPick($event)"
  />
  @if (item) {
    <p class="picked">
      <mat-icon>check_circle</mat-icon>{{ item.label }}
    </p>
  }

  <app-lookup-autocomplete
    label="Supplier"
    placeholder="Search supplier code or name"
    [required]="true"
    [minSearchLength]="2"
    [search]="vendorSearch"
    (selectionChange)="onVendorPick($event)"
  />

  <mat-form-field appearance="outline">
    <mat-label>Inspection date</mat-label>
    <input matInput [(ngModel)]="date" [matDatepicker]="dp" required />
    <mat-datepicker-toggle matSuffix [for]="dp"></mat-datepicker-toggle>
    <mat-datepicker #dp></mat-datepicker>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Measuring instrument</mat-label>
    <input matInput [(ngModel)]="instrument" placeholder="e.g. Jangka sorong 0,01 mm" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>QF No.</mat-label>
    <input matInput [(ngModel)]="qfnum" placeholder="QC file number" />
  </mat-form-field>
</div>

<mat-dialog-actions align="end" class="new-foot">
  <button mat-button (click)="cancel()">Cancel</button>
  <button
    mat-flat-button
    color="primary"
    [disabled]="!item || !vendor || !date || saving"
    (click)="save()"
  >
    @if (saving) {
      <mat-spinner diameter="16" class="save-spinner"></mat-spinner>
    }
    Create inspection
  </button>
</mat-dialog-actions>
