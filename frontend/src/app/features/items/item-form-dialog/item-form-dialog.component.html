<h2 mat-dialog-title>{{ isEdit ? 'Edit item' : 'Add item' }}</h2>

<mat-dialog-content>
  <div class="form-fields">
    <mat-form-field appearance="outline">
      <mat-label>Part No.</mat-label>
      <input
        matInput
        [(ngModel)]="itemid"
        [disabled]="isEdit"
        placeholder="e.g. 622-064"
        required
        maxlength="30"
      />
      @if (!isEdit) {
        <mat-hint>Unique identifier, cannot be changed later</mat-hint>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Part name</mat-label>
      <input
        matInput
        [(ngModel)]="name"
        placeholder="e.g. S/A Top Hinge"
        required
        maxlength="100"
      />
    </mat-form-field>
  </div>
  @if (!isEdit) {
    <p class="form-note">Standards are added after the item exists.</p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()" [disabled]="saving">Cancel</button>
  <button mat-flat-button color="primary" (click)="save()" [disabled]="saving">
    @if (saving) {
      Saving...
    } @else {
      {{ isEdit ? 'Update' : 'Add item' }}
    }
  </button>
</mat-dialog-actions>
