<div
  class="panel"
  [class]="'panel ' + state()"
  [attr.role]="state() === 'error' ? 'alert' : 'status'"
>
  @if (state() === 'loading') {
    <mat-spinner diameter="32" />
  } @else {
    <span class="badge"
      ><mat-icon>{{ icon() || defaultIcon[state()] }}</mat-icon></span
    >
  }
  @if (title()) {
    <h2>{{ title() }}</h2>
  }
  @if (message()) {
    <p>{{ message() }}</p>
  }
  <ng-content />
</div>
