<dialog
  #dialog
  class="modal"
  [class]="'modal ' + size()"
  aria-labelledby="modal-title"
  (cancel)="onCancel($event)"
  (close)="onClosed()"
>
  <header class="modal-head">
    <div>
      <h2 id="modal-title">{{ title() }}</h2>
      @if (subtitle()) {
        <p>{{ subtitle() }}</p>
      }
    </div>
    <button
      type="button"
      class="close"
      aria-label="Close"
      [disabled]="!dismissible()"
      (click)="close()"
    >
      <mat-icon>close</mat-icon>
    </button>
  </header>
  <div class="modal-body"><ng-content /></div>
  <footer class="modal-foot"><ng-content select="[modalFooter]" /></footer>
</dialog>
